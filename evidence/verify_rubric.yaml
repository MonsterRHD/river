rubrics:
  - id: 1
    type: f2p
    text: "排空请求返回稳定交接标识和可观察进度，同一队列同一请求重试不会创建第二个会话。"
  - id: 2
    type: f2p
    text: "所有实例停止为排空队列领取新作业，但请求前已领取的作业可按原语义完成、重试或取消。"
  - id: 3
    type: f2p
    text: "排空意图和在途进度写入数据库，发起实例退出后其他实例能继续观察并完成同一交接。"
  - id: 4
    type: f2p
    text: "在途数量归零前不会报告排空完成，归零后只报告一次完成并保留正常作业完成事件。"
  - id: 5
    type: f2p
    text: "领导者切换后维护服务接管未完成会话，不会恢复领取或遗失最终状态。"
  - id: 6
    type: f2p
    text: "通知不可用时轮询路径仍收敛；调用等待超时只结束等待，不撤销排空状态。"
  - id: 7
    type: p2p
    text: "未调用排空功能时，现有启动、暂停、恢复、Stop 和 StopAndCancel 行为保持兼容。"
  - id: 8
    type: f2p
    text: "未调用排空功能时，现有启动、暂停、恢复、Stop 和 StopAndCancel 行为保持兼容，正常作业完成事件不受影响。"
