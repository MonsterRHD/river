rubrics:
  - id: 1
    type: f2p
    text: "执行型客户端启动后创建带唯一代际和到期时间的生产者租约，容量统计只计当前有效租约。"
  - id: 2
    type: f2p
    text: "成功续期原子延长同一代租约，不新增生产者，也不改变所属队列容量。"
  - id: 3
    type: f2p
    text: "正常 Stop 主动释放租约并产生一次可观察下线变化，停止返回后记录不再有效。"
  - id: 4
    type: f2p
    text: "进程无清理退出时，当前维护领导者在到期后回收记录并纠正队列容量。"
  - id: 5
    type: f2p
    text: "回收与迟到心跳并发时使用代际保护，旧心跳不能覆盖或复活新实例的记录。"
  - id: 6
    type: f2p
    text: "数据库或通知短暂失败会退避恢复；领导者切换后仍完成回收且不重复发布下线变化。"
  - id: 7
    type: p2p
    text: "只执行插入、不配置 Queues/Workers 的客户端不创建生产者租约。"
  - id: 8
    type: f2p
    text: "既有作业领取、完成、队列暂停恢复和队列清理行为不因租约修复而回归。"
