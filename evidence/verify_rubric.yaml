rubrics:
  - id: 1
    type: f2p
    text: "StopAndCancel 先停止新领取，再取消在途执行，并允许每个已返回 work unit 向完成器提交一个最终结果。"
  - id: 2
    type: f2p
    text: "完成器在停止成功返回前持久化关闭前已接受的所有结果，作业不会继续停留在 running。"
  - id: 3
    type: f2p
    text: "批量状态更新部分失败时只重试尚未确认的结果，已经确认的结果不会重复写入。"
  - id: 4
    type: f2p
    text: "持久化成功的结果对应一个订阅最终事件，关闭竞态不会丢事件或发送重复事件。"
  - id: 5
    type: f2p
    text: "重启后的救援不会覆盖前一进程已最终化的作业，只处理确实遗留的旧 running 尝试。"
  - id: 6
    type: f2p
    text: "排空期限耗尽会返回明确错误并保留可恢复状态，不把未落库结果报告成成功。"
  - id: 7
    type: p2p
    text: "普通 Stop 继续等待作业自然完成，未启动和重复停止仍保持幂等。"
  - id: 8
    type: f2p
    text: "取消、重试、丢弃和成功四类既有最终状态保持正确。"
